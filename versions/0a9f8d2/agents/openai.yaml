interface:
  display_name: "Harmony Form 卡片生成（Design Compact）"
  short_description: "按远程 Design Compact 规范生成 2x2/2x4 HarmonyOS Form 卡片。"
  default_prompt: "使用 $harmony-card-generation-offline 生成 HarmonyOS A2UI Form 服务卡片。先读取核心规则、生成流程和 Design Compact 对齐规范，按用户尺寸选择固定骨架，严格控制信息/动作预算、字体、间距、色板、图表与素材；使用完整 Form JSONL、已声明绑定/事件和 CardSpec，最后只输出 genui 与 cardspec 代码块。"
